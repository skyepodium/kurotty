name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Automatic update contract
        run: ./scripts/check-update-contract.sh
      # First, and before anything that takes minutes: a bad settings merge is
      # visible in the source text alone, and this answers in seconds without
      # needing the package to compile.
      - name: Settings schema invariants
        run: ./scripts/check-settings-schema.sh
      - name: Install Zig
        run: brew install zig
      - name: Zig unit tests
        run: zig build test
      - name: Zig build libraries
        run: zig build
      - name: Benchmark smoke
        run: zig build bench
      - name: Scrollback stress
        run: zig build stress-scrollback
      - name: Leak check
        run: zig build leak-check
      - name: Swift/AppKit shell build
        run: swift build
      - name: Swift rendering regression tests
        run: swift test
      - name: Dump crash reports on failure
        if: failure()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          for f in ~/Library/Logs/DiagnosticReports/xctest*; do
            [ -e "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done
